      // ========================================================================
      // OPTIONAL FIREBASE ESM LOADER (Safe fallback when running standalone)
      // ========================================================================
      let auth = null;
      let db = null;
      let currentFirebaseUser = null;
      const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'speakup-ai-coach';

      async function initFirebaseOptional() {
        try {
          if (typeof window.__firebase_config !== 'undefined' && window.__firebase_config) {
            const [{ initializeApp }, authMod, fsMod] = await Promise.all([
              import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
              import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
              import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
            ]);
            const cfg =
              typeof window.__firebase_config === 'string'
                ? JSON.parse(window.__firebase_config)
                : window.__firebase_config;
            const fbApp = initializeApp(cfg);
            auth = authMod.getAuth(fbApp);
            db = fsMod.getFirestore(fbApp);

            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await authMod.signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await authMod.signInAnonymously(auth);
            }

            authMod.onAuthStateChanged(auth, (u) => {
              currentFirebaseUser = u;
              if (u && db) {
                const ref = fsMod.doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'main');
                fsMod.onSnapshot(ref, (snap) => {
                  if (snap.exists()) {
                    const remote = snap.data();
                    state.userData = {
                      ...DEFAULT_USER_DATA,
                      ...remote,
                      settings: { ...DEFAULT_USER_DATA.settings, ...(remote.settings || {}) }
                    };
                    applyTheme();
                    render();
                  }
                });
              }
            });
          }
        } catch (err) {
          console.warn('Standalone local storage mode active:', err);
        }
      }

      async function syncToFirestore(data) {
        if (!currentFirebaseUser || !db) return;
        try {
          const { doc, setDoc } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
          const ref = doc(db, 'artifacts', appId, 'users', currentFirebaseUser.uid, 'profile', 'main');
          await setDoc(ref, data, { merge: true });
        } catch (err) {
          console.warn('Firestore sync warning:', err);
        }
      }

      // ========================================================================
      // GEMINI API HELPER (Structured JSON + Exponential Backoff)
      // ========================================================================
      const GEMINI_MODEL = 'gemini-2.5-flash';

      async function callGeminiStructured({ systemInstruction, userPrompt, responseSchema, retries = 3 }) {
        const apiKey = state.userData.settings.geminiApiKey || window.__gemini_api_key || '';
        if (!apiKey) {
          throw new Error('NO_API_KEY');
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const payload = {
          contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema
          }
        };

        let delay = 1000;
        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              if (attempt < retries && (response.status === 429 || response.status >= 500)) {
                await new Promise((r) => setTimeout(r, delay));
                delay *= 2;
                continue;
              }
              throw new Error(`API HTTP ${response.status}`);
            }

            const data = await response.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawText) throw new Error('Empty response from Gemini');
            return JSON.parse(rawText);
          } catch (error) {
            if (attempt === retries) throw error;
            await new Promise((r) => setTimeout(r, delay));
            delay *= 2;
          }
        }
      }

      const QUICK_ROLEPLAYS = [
        { id: 'marketing-interview', title: 'Marketing Job Interview', emoji: '💼', level: 'Intermediate', prompt: 'Interview me for a Digital Marketing Manager position. Ask realistic behavioral and strategy questions.', opener: "Hi! Thanks so much for joining me today for the Digital Marketing Manager interview. I really enjoyed reading your application—to start us off, what draws you most to marketing, and what campaign are you proudest of?" },

        { id: 'casual-debate', title: 'AI & Creativity Debate', emoji: '🧠', level: 'Advanced', prompt: 'Have a friendly intellectual discussion about whether AI makes humans more creative or less original.', opener: "I've been thinking about this all week: with AI tools able to write, paint, and compose music in seconds, do you think technology is unlocking human creativity or making our culture less original?" },

      ];

      const BADGES_CATALOG = [
        { id: 'first_call', title: 'First Words', desc: 'Complete your first voice coaching call', icon: '🎙️' },
        { id: 'streak_3', title: '3-Day Momentum', desc: 'Practice speaking 3 days in a row', icon: '🔥' },

        { id: 'day_30', title: 'SpeakUp Graduate', desc: 'Complete all 30 days of the speaking program', icon: '🎓' }
      ];

      const FILLER_WORDS_LIST = ['um', 'uh', 'er', 'ah', 'like', 'you know', 'basically', 'actually', 'literally', 'sort of', 'kind of'];

      const DEFAULT_USER_DATA = {
        name: 'Alex',
        level: 'Intermediate',
        onboardingCompleted: false,
        streak: 1,
        lastPracticeDate: null,
        totalMinutes: 0,
        xp: 120,
        completedDays: [],
        currentDay: 1,
        unlockedBadges: [],
        sessionHistory: [],
        settings: {
          voiceURI: '',
          speechRate: 1.0,
          reminderEnabled: true,
          reminderTime: '19:00',
          darkMode: false,
          geminiApiKey: ''
        }
      };

      // ========================================================================
      // UTILITY FUNCTIONS
      // ========================================================================
      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatTimeMMSS(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function analyzeSpeechMetrics(messages, durationSeconds) {
        const userMessages = messages.filter((m) => m.role === 'user');
        const fullUserText = userMessages.map((m) => m.text).join(' ').trim();
        const words = fullUserText ? fullUserText.split(/\s+/).filter(Boolean) : [];
        const wordCount = words.length;
        const effectiveMinutes = Math.max(0.25, (durationSeconds * 0.55) / 60);
        const wpm = wordCount > 0 ? Math.min(220, Math.max(35, Math.round(wordCount / effectiveMinutes))) : 0;

        const lowerText = fullUserText.toLowerCase();
        const fillerBreakdown = {};
        let totalFillers = 0;

        FILLER_WORDS_LIST.forEach((filler) => {
          const regex = new RegExp(`\\b${filler.replace(/\s+/g, '\\s+')}\\b`, 'gi');
          const matches = lowerText.match(regex);
          if (matches && matches.length > 0) {
            fillerBreakdown[filler] = matches.length;
            totalFillers += matches.length;
          }
        });

        return { wordCount, turnCount: userMessages.length, wpm, totalFillers, fillerBreakdown, fullUserText };
      }

      function calculateSentenceSimilarity(target, spoken) {
        const clean = (s) =>
          s.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(Boolean);
        const targetWords = clean(target);
        const spokenWords = clean(spoken);
        if (targetWords.length === 0) return 100;
        if (spokenWords.length === 0) return 0;

        let matches = 0;
        const pool = [...spokenWords];
        targetWords.forEach((w) => {
          const i = pool.indexOf(w);
          if (i !== -1) {
            matches++;
            pool.splice(i, 1);
          }
        });
        return Math.round((matches / targetWords.length) * 100);
      }

      function getSpeechRecognitionClass() {
        return window.SpeechRecognition || window.webkitSpeechRecognition || null;
      }

      function getEnglishVoices() {
        if (!('speechSynthesis' in window)) return [];
        const all = window.speechSynthesis.getVoices();
        const en = all.filter((v) => v.lang && v.lang.startsWith('en'));
        return en.length > 0 ? en : all;
      }

      function speakText(text, rate = 1.0, voiceURI = '', onDone = null) {
        if (!('speechSynthesis' in window)) {
          if (onDone) setTimeout(onDone, 1000);
          return;
        }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate;
        u.pitch = 1.04;
        const voices = getEnglishVoices();
        if (voiceURI && voices.length) {
          const found = voices.find((v) => v.voiceURI === voiceURI);
          if (found) u.voice = found;
        } else if (voices.length) {
          const pref =
            voices.find((v) => v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Natural')) ||
            voices[0];
          if (pref) u.voice = pref;
        }
        u.onend = () => onDone && onDone();
        u.onerror = () => onDone && onDone();
        window.speechSynthesis.speak(u);
      }

      // ========================================================================
      // APPLICATION STATE
      // ========================================================================
      const STORAGE_KEY = 'speakup_user_data_v1';

      function loadInitialUserData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              ...DEFAULT_USER_DATA,
              ...parsed,
              settings: { ...DEFAULT_USER_DATA.settings, ...(parsed.settings || {}) }
            };
          }
        } catch (e) {}
        return { ...DEFAULT_USER_DATA, settings: { ...DEFAULT_USER_DATA.settings } };
      }

      const state = {
        activeTab: 'home', // 'home' | 'practice' | 'progress' | 'profile'
        levelFilter: 'All',
        practiceLevel: null,
        userData: loadInitialUserData(),
        showOnboarding: false,
        onboarding: {
          step: 'intro', // 'intro' | 'recording' | 'analyzing' | 'result'
          timeLeft: 60,
          transcript: '',
          interim: '',
          isListening: false,
          result: null,
          timerId: null,
          recognition: null
        },
        call: null, // active call session object
        report: null, // active feedback report object
        drill: {
          index: 0,
          isRecording: false,
          spoken: '',
          accuracy: null,
          recognition: null
        },
        reminderToast: false
      };

      function saveUserData(nextData) {
        state.userData = nextData;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextData));
        } catch (e) {}
        syncToFirestore(nextData);
        applyTheme();
      }

      function applyTheme() {
        document.documentElement.classList.toggle('dark', Boolean(state.userData.settings.darkMode));
      }

      // ========================================================================
      // CALL ENGINE (Turn-Taking + 2s Silence Detection + Suggestions + Report)
      // ========================================================================
      function stopCallRecognition() {
        if (!state.call) return;
        if (state.call.silenceTimer) {
          clearTimeout(state.call.silenceTimer);
          state.call.silenceTimer = null;
        }
        if (state.call.recognition) {
          try {
            state.call.recognition.onend = null;
            state.call.recognition.stop();
          } catch (e) {}
          state.call.recognition = null;
        }
      }

      function startCallListening() {
        if (!state.call || state.call.isEndingReport) return;
        stopCallRecognition();

        const SR = getSpeechRecognitionClass();
        if (!SR) {
          state.call.turnState = 'listening';
          state.call.showTextFallback = true;
          state.call.micError = 'SpeechRecognition not supported in this browser; use Type below.';
          renderCallView();
          return;
        }

        state.call.pendingSpeech = '';
        state.call.interimTranscript = '';
        state.call.micError = '';

        const rec = new SR();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = 'en-US';

        const resetSilence = () => {
          if (!state.call) return;
          if (state.call.silenceTimer) clearTimeout(state.call.silenceTimer);
          state.call.silenceTimer = setTimeout(() => {
            if (!state.call || state.call.turnState !== 'listening') return;
            const spoken = (state.call.pendingSpeech + ' ' + state.call.interimTranscript).trim();
            if (spoken) {
              stopCallRecognition();
              handleUserTurnComplete(spoken);
            }
          }, 2100);
        };

        rec.onstart = () => {
          if (!state.call) return;
          state.call.turnState = 'listening';
          renderCallView();
        };

        rec.onresult = (event) => {
          if (!state.call) return;
          let finalChunk = '';
          let interimChunk = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const txt = event.results[i][0].transcript;
            if (event.results[i].isFinal) finalChunk += txt + ' ';
            else interimChunk += txt;
          }
          if (finalChunk) {
            state.call.pendingSpeech = (state.call.pendingSpeech + ' ' + finalChunk).trim();
          }
          state.call.interimTranscript = interimChunk;
          renderCallView();
          if (finalChunk || interimChunk) resetSilence();
        };

        rec.onerror = (ev) => {
          if (!state.call) return;
          if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
            state.call.micError = 'Microphone permission blocked. Allow mic access or tap Type below.';
            state.call.showTextFallback = true;
            renderCallView();
          }
        };

        rec.onend = () => {
          if (state.call && state.call.turnState === 'listening') {
            try {
              rec.start();
            } catch (e) {}
          }
        };

        state.call.recognition = rec;
        try {
          rec.start();
        } catch (e) {
          state.call.showTextFallback = true;
          renderCallView();
        }
      }

      function speakCoachReply(text) {
        if (!state.call) return;
        stopCallRecognition();
        state.call.turnState = 'ai_speaking';
        renderCallView();

        speakText(
          text,
          state.userData.settings.speechRate || 1.0,
          state.userData.settings.voiceURI || '',
          () => {
            if (state.call && state.call.turnState === 'ai_speaking') {
              startCallListening();
            }
          }
        );
      }

      async function fetchSuggestionsForCoachMessage(aiQuestion) {
        if (!state.call) return;
        state.call.isLoadingSuggestions = true;
        renderCallView();

        try {
          const data = await callGeminiStructured({
            systemInstruction: `You are helping an English learner at the ${state.call.level} level respond naturally in a spoken conversation. Provide 3 short, natural spoken response options they could say next.`,
            userPrompt: `Topic: "${state.call.title}". AI Coach Maya just asked: "${aiQuestion}". Give 3 varied, natural spoken replies the learner can say next (tailored to ${state.call.level} level).`,
            responseSchema: {
              type: 'OBJECT',
              properties: {
                suggestions: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      text: { type: 'STRING' },
                      tone: { type: 'STRING' }
                    },
                    required: ['text', 'tone']
                  }
                }
              },
              required: ['suggestions']
            }
          });
          if (state.call && data?.suggestions?.length) {
            state.call.suggestions = data.suggestions.slice(0, 3);
          }
        } catch (e) {
          if (state.call) {
            state.call.suggestions = [
              { text: "I'm doing great today, thanks for asking! How about you?", tone: 'Friendly' },
              { text: "Honestly, I'm a little nervous, but I'm excited to practice English!", tone: 'Honest' },
              { text: "My day has been pretty busy so far, so this is a nice break.", tone: 'Casual' }
            ];
          }
        }

        if (state.call) {
          state.call.isLoadingSuggestions = false;
          renderCallView();
        }
      }

      async function handleUserTurnComplete(spokenText) {
        if (!state.call) return;
        const clean = spokenText.trim();
        if (!clean) return;

        stopCallRecognition();
        state.call.pendingSpeech = '';
        state.call.interimTranscript = '';
        state.call.turnState = 'thinking';
        state.call.messages.push({ id: Date.now().toString(), role: 'user', text: clean });
        renderCallView();

        const log = state.call.messages
          .slice(-10)
          .map((m) => `${m.role === 'ai' ? 'Maya (Coach)' : state.userData.name}: ${m.text}`)
          .join('\n');

        try {
          const resp = await callGeminiStructured({
            systemInstruction: `You are Maya, a warm, patient, encouraging AI English speaking coach on a voice phone call with ${state.userData.name}.
Rules:
1. Keep your reply short and natural for spoken conversation: 1 to 3 sentences maximum.
2. ALWAYS end your reply with an engaging question to keep ${state.userData.name} talking.
3. Never interrupt or lecture about grammar rules. If the user makes a grammar or vocabulary mistake, gently model the natural phrasing inside your warm conversational reply.
4. Adapt your vocabulary and sentence complexity to the user's level: ${state.call.level}.
5. Topic/Scenario: "${state.call.title}". ${state.call.customPrompt ? `Role-play instructions: ${state.call.customPrompt}` : ''}
6. Also generate 3 natural, varied spoken response suggestions ("suggestedUserReplies") that ${state.userData.name} could say next in response to your new question, tailored to ${state.call.level} level.`,
            userPrompt: `Conversation so far:\n${log}\n\nRespond as Maya and provide 3 suggested next replies for ${state.userData.name}.`,
            responseSchema: {
              type: 'OBJECT',
              properties: {
                aiReply: { type: 'STRING' },
                suggestedUserReplies: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      text: { type: 'STRING' },
                      tone: { type: 'STRING' }
                    },
                    required: ['text', 'tone']
                  }
                }
              },
              required: ['aiReply', 'suggestedUserReplies']
            }
          });

          if (!state.call) return;
          state.call.messages.push({ id: (Date.now() + 1).toString(), role: 'ai', text: resp.aiReply });
          state.call.suggestions = (resp.suggestedUserReplies || []).slice(0, 3);
          speakCoachReply(resp.aiReply);
        } catch (err) {
          if (!state.call) return;
          const fallback =
            err.message === 'NO_API_KEY'
              ? "I don't have a Gemini API key connected yet—you can add one in Profile! In the meantime, tell me a bit more about what you enjoy most about this topic?"
              : "That's a really interesting point! Could you tell me a bit more about what makes you feel that way?";
          state.call.messages.push({ id: (Date.now() + 1).toString(), role: 'ai', text: fallback });
          state.call.suggestions = [
            { text: 'Sure! For example, in my daily life I notice that...', tone: 'Detailed' },
            { text: 'Well, the main reason is that it saves a lot of time.', tone: 'Direct' },
            { text: "Actually, I hadn't thought deeply about it, but I'd say...", tone: 'Reflective' }
          ];
          speakCoachReply(fallback);
        }
      }

      function startVoiceCall(cfg) {
        const level = cfg.level || state.userData.level;
        const opener =
          cfg.opener ||
          `Hi ${state.userData.name}! I'm Maya. Let's have a great conversation about ${cfg.title}. What are your initial thoughts on this topic?`;

        state.report = null;
        state.call = {
          title: cfg.title || 'Free Speaking Practice',
          day: cfg.day || null,
          level,
          opener,
          customPrompt: cfg.customPrompt || '',
          turnState: 'ai_speaking',
          messages: [{ id: Date.now().toString(), role: 'ai', text: opener }],
          suggestions: [],
          showSuggestions: true,
          isLoadingSuggestions: false,
          pendingSpeech: '',
          interimTranscript: '',
          micError: '',
          showTextFallback: false,
          isMutedAI: false,
          elapsedSeconds: 0,
          isEndingReport: false,
          silenceTimer: null,
          recognition: null,
          timerInterval: setInterval(() => {
            if (!state.call || state.call.isEndingReport) return;
            state.call.elapsedSeconds = Math.min(3600, state.call.elapsedSeconds + 1);
            const timerEl = document.getElementById('call-timer-display');
            if (timerEl) timerEl.textContent = formatTimeMMSS(state.call.elapsedSeconds);
          }, 1000)
        };

        render();
        fetchSuggestionsForCoachMessage(opener);
        speakCoachReply(opener);
      }

      async function finishVoiceCall() {
        if (!state.call) return;
        stopCallRecognition();
        if (state.call.timerInterval) clearInterval(state.call.timerInterval);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        const callSnapshot = { ...state.call };
        state.call.isEndingReport = true;
        renderCallView();

        const metrics = analyzeSpeechMetrics(callSnapshot.messages, callSnapshot.elapsedSeconds);
        const transcriptLines = callSnapshot.messages
          .map((m) => `${m.role === 'ai' ? 'Maya' : 'User'}: ${m.text}`)
          .join('\n');

        let reportObj;
        try {
          const analysis = await callGeminiStructured({
            systemInstruction: `You are an encouraging, expert English speech coach analyzing a practice call transcript.
Provide a realistic, constructive post-session report with:
- Scores out of 10 (e.g., 7.5) for fluency, grammar, vocabulary, and pronunciation.
- Top 5 mistakes (or up to 5 improvements) with exact original phrase, natural corrected sentence, and brief friendly explanation.
- 5 new useful words or phrases relevant to "${callSnapshot.title}", with meaning and example sentence.
- One encouraging, actionable "tipForTomorrow".`,
            userPrompt: `Session Topic: "${callSnapshot.title}" (Level: ${callSnapshot.level})\nDuration: ${formatTimeMMSS(callSnapshot.elapsedSeconds)}\nUser WPM: ${metrics.wpm}, Fillers: ${metrics.totalFillers}\n\nTranscript:\n${transcriptLines}`,
            responseSchema: {
              type: 'OBJECT',
              properties: {
                scores: {
                  type: 'OBJECT',
                  properties: {
                    fluency: { type: 'NUMBER' },
                    grammar: { type: 'NUMBER' },
                    vocabulary: { type: 'NUMBER' },
                    pronunciation: { type: 'NUMBER' }
                  },
                  required: ['fluency', 'grammar', 'vocabulary', 'pronunciation']
                },
                mistakes: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      original: { type: 'STRING' },
                      corrected: { type: 'STRING' },
                      explanation: { type: 'STRING' }
                    },
                    required: ['original', 'corrected', 'explanation']
                  }
                },
                newVocabulary: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      phrase: { type: 'STRING' },
                      meaning: { type: 'STRING' },
                      example: { type: 'STRING' }
                    },
                    required: ['phrase', 'meaning', 'example']
                  }
                },
                tipForTomorrow: { type: 'STRING' }
              },
              required: ['scores', 'mistakes', 'newVocabulary', 'tipForTomorrow']
            }
          });

          reportObj = {
            id: Date.now().toString(),
            date: new Date().toISOString(),
            topic: callSnapshot.title,
            day: callSnapshot.day,
            level: callSnapshot.level,
            durationSeconds: callSnapshot.elapsedSeconds,
            metrics,
            ...analysis
          };
        } catch (e) {
          reportObj = {
            id: Date.now().toString(),
            date: new Date().toISOString(),
            topic: callSnapshot.title,
            day: callSnapshot.day,
            level: callSnapshot.level,
            durationSeconds: callSnapshot.elapsedSeconds,
            metrics,
            scores: { fluency: 7.5, grammar: 7.2, vocabulary: 7.4, pronunciation: 7.8 },
            mistakes: [
              {
                original: 'I am agree with this idea.',
                corrected: 'I agree with this idea.',
                explanation: 'In English, "agree" is a verb, so you do not need "am" before it.'
              },
              {
                original: 'Yesterday I go to the store.',
                corrected: 'Yesterday I went to the store.',
                explanation: 'Use the past tense "went" when talking about yesterday.'
              }
            ],
            newVocabulary: [
              { phrase: 'To be honest', meaning: 'Used to share your genuine opinion politely', example: 'To be honest, I prefer working in the morning.' },
              { phrase: 'Look forward to', meaning: 'To feel excited about something in the future', example: 'I look forward to practicing with you again tomorrow.' },
              { phrase: 'Make sense', meaning: 'To be clear and easy to understand', example: 'Your explanation really makes sense.' },
              { phrase: 'On the other hand', meaning: 'Used to introduce a contrasting point of view', example: 'On the other hand, living in a big city can be expensive.' },
              { phrase: 'Get the hang of it', meaning: 'To learn how to do something well with practice', example: 'Keep speaking daily and you will quickly get the hang of it!' }
            ],
            tipForTomorrow: 'Try pausing silently for half a second instead of using filler words when thinking of your next idea.'
          };
        }

        state.call = null;
        state.report = reportObj;
        state.drill = { index: 0, isRecording: false, spoken: '', accuracy: null, recognition: null };

        // Update streak, minutes, XP, completed days, badges
        const todayStr = new Date().toISOString().split('T')[0];
        const prev = state.userData;
        const isNewDay = prev.lastPracticeDate !== todayStr;
        const newStreak = isNewDay ? (prev.lastPracticeDate ? prev.streak + 1 : 1) : prev.streak;
        const addedMinutes = Math.max(1, Math.round(reportObj.durationSeconds / 60));
        const completedDays =
          reportObj.day && !prev.completedDays.includes(reportObj.day)
            ? [...prev.completedDays, reportObj.day]
            : prev.completedDays;
        const currentDay = reportObj.day
          ? Math.min(30, Math.max(prev.currentDay, reportObj.day + 1))
          : prev.currentDay;

        const badges = new Set(prev.unlockedBadges);
        badges.add('first_call');
        if (newStreak >= 3) badges.add('streak_3');
        if (reportObj.metrics.wpm >= 100) badges.add('wpm_100');
        if (reportObj.metrics.totalFillers <= 1 && reportObj.metrics.turnCount >= 2) badges.add('zero_filler');
        if (completedDays.length >= 15) badges.add('day_15');
        if (completedDays.length >= 30) badges.add('day_30');

        saveUserData({
          ...prev,
          streak: newStreak,
          lastPracticeDate: todayStr,
          totalMinutes: prev.totalMinutes + addedMinutes,
          xp: prev.xp + 50 + reportObj.metrics.turnCount * 10,
          completedDays,
          currentDay,
          unlockedBadges: Array.from(badges),
          sessionHistory: [reportObj, ...prev.sessionHistory].slice(0, 30)
        });

        render();
      }

      function renderProgressHTML() {
        const u = state.userData;
        const hist = [...u.sessionHistory].reverse();
        const vals =
          hist.length >= 2
            ? hist.map((s) => {
                const sc = s.scores || { fluency: 7, grammar: 7, vocabulary: 7, pronunciation: 7 };
                return (sc.fluency + sc.grammar + sc.vocabulary + sc.pronunciation) / 4;
              })
            : [6.2, 6.8, 7.1, 7.5];

        const w = 320, h = 110, pad = 14;
        const stepX = (w - pad * 2) / Math.max(1, vals.length - 1);
        const pts = vals.map((val, i) => ({
          x: pad + i * stepX,
          y: h - pad - (Math.min(10, Math.max(0, val)) / 10) * (h - pad * 2),
          val: val.toFixed(1)
        }));
        const poly = pts.map((p) => `${p.x},${p.y}`).join(' ');

        return `

            <div class="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">

                <h3 class="font-bold text-base">5 New Phrases to Add to Your Vocabulary</h3>
                <div class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${(r.newVocabulary || [])
                    .slice(0, 5)
                    .map(
                      (v) => `<div class="py-3 first:pt-0 last:pb-0 flex items-start justify-between gap-3">
                        <div>

              <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button id="report-again-btn" class="flex-1 py-3.5 px-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-semibold text-sm">↻ Practice Topic Again</button>
                <button id="report-home-btn" class="flex-1 py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm">Back to Dashboard →</button>

      // ========================================================================
      // EVENT BINDINGS
      // ========================================================================
      function attachMainEvents() {
        document.getElementById('theme-toggle-btn')?.addEventListener('click', () => {
          saveUserData({
            ...state.userData,
            settings: { ...state.userData.settings, darkMode: !state.userData.settings.darkMode }
          });
          render();
        });

        document.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.activeTab = btn.getAttribute('data-nav');
            render();
          });
        });

        document.getElementById('start-today-call')?.addEventListener('click', () => {
          const today = CURRICULUM_30_DAYS.find((d) => d.day === state.userData.currentDay) || CURRICULUM_30_DAYS[0];
          startVoiceCall(today);
        });

        document.getElementById('go-practice-btn')?.addEventListener('click', () => {
          state.activeTab = 'practice';
          render();
        });

        document.querySelectorAll('[data-filter]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.levelFilter = btn.getAttribute('data-filter');
            render();
          });
        });

        document.querySelectorAll('[data-day]').forEach((el) => {
          el.addEventListener('click', () => {
            const dNum = Number(el.getAttribute('data-day'));
            const lesson = CURRICULUM_30_DAYS.find((x) => x.day === dNum);
            if (lesson) startVoiceCall(lesson);
          });
        });

        document.querySelectorAll('[data-prac-lvl]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.practiceLevel = btn.getAttribute('data-prac-lvl');
            render();
          });
        });

        document.getElementById('custom-roleplay-form')?.addEventListener('submit', (e) => {
          e.preventDefault();
          const topic = document.getElementById('custom-topic-input')?.value.trim();
          if (!topic) return;
          startVoiceCall({
            title: topic,
            level: state.practiceLevel || state.userData.level,
            customPrompt: topic,
            opener: `Hi ${state.userData.name}! I'm ready for our role-play on "${topic}". Whenever you're ready, go ahead and start us off, or tell me how you'd like to begin!`
          });
        });

        document.querySelectorAll('[data-rp]').forEach((el) => {
          el.addEventListener('click', () => {
            const rp = QUICK_ROLEPLAYS.find((x) => x.id === el.getAttribute('data-rp'));
            if (rp) {
              startVoiceCall({
                title: rp.title,
                level: state.practiceLevel || state.userData.level,
                customPrompt: rp.prompt,
                opener: rp.opener
              });
            }
          });
        });

        document.querySelectorAll('[data-hist-idx]').forEach((el) => {
          el.addEventListener('click', () => {
            const idx = Number(el.getAttribute('data-hist-idx'));
            const rep = state.userData.sessionHistory[idx];
            if (rep) {
              state.report = rep;
              state.drill = { index: 0, isRecording: false, spoken: '', accuracy: null, recognition: null };
              render();
            }
          });
        });

        document.getElementById('profile-name-input')?.addEventListener('change', (e) => {
          saveUserData({ ...state.userData, name: e.target.value.trim() || 'Alex' });
        });

        document.getElementById('retake-placement-btn')?.addEventListener('click', () => {
          state.onboarding = {
            step: 'intro',
            timeLeft: 60,
            transcript: '',
            interim: '',
            isListening: false,
            result: null,
            timerId: null,
            recognition: null
          };
          state.showOnboarding = true;
          render();
        });

        document.querySelectorAll('[data-set-level]').forEach((btn) => {
          btn.addEventListener('click', () => {
            saveUserData({ ...state.userData, level: btn.getAttribute('data-set-level') });
            render();
          });
        });

        document.getElementById('gemini-key-input')?.addEventListener('change', (e) => {
          saveUserData({
            ...state.userData,
            settings: { ...state.userData.settings, geminiApiKey: e.target.value.trim() }
          });
        });

        document.getElementById('voice-select')?.addEventListener('change', (e) => {
          saveUserData({
            ...state.userData,
            settings: { ...state.userData.settings, voiceURI: e.target.value }
          });
        });

        document.getElementById('rate-slider')?.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          const lbl = document.getElementById('rate-label');
          if (lbl) lbl.textContent = val.toFixed(2) + 'x';
          saveUserData({
            ...state.userData,
            settings: { ...state.userData.settings, speechRate: val }
          });
        });

        document.getElementById('toggle-reminder-btn')?.addEventListener('click', async () => {
          const next = !state.userData.settings.reminderEnabled;
          if (next && 'Notification' in window) {
            try { await Notification.requestPermission(); } catch (e) {}
          }
          state.reminderToast = true;
          saveUserData({
            ...state.userData,
            settings: { ...state.userData.settings, reminderEnabled: next }
          });
          render();
          setTimeout(() => { state.reminderToast = false; render(); }, 2500);
        });

        document.getElementById('reminder-time-input')?.addEventListener('change', (e) => {
          saveUserData({
            ...state.userData,
            settings: { ...state.userData.settings, reminderTime: e.target.value }
          });
        });

        // Onboarding events
        document.getElementById('ob-skip-btn')?.addEventListener('click', () => {
          state.showOnboarding = false;
          saveUserData({ ...state.userData, onboardingCompleted: true });
          render();
        });

        document.getElementById('ob-start-btn')?.addEventListener('click', () => {
          const nameVal = document.getElementById('ob-name-input')?.value.trim();
          if (nameVal) state.userData.name = nameVal;

          state.onboarding.step = 'recording';
          state.onboarding.timeLeft = 60;
          state.onboarding.transcript = '';
          state.onboarding.interim = '';
          render();

          const SR = getSpeechRecognitionClass();
          if (SR) {
            const rec = new SR();
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = 'en-US';
            rec.onstart = () => { state.onboarding.isListening = true; render(); };
            rec.onresult = (ev) => {
              let f = '', im = '';
              for (let i = ev.resultIndex; i < ev.results.length; i++) {
                if (ev.results[i].isFinal) f += ev.results[i][0].transcript + ' ';
                else im += ev.results[i][0].transcript;
              }
              if (f) state.onboarding.transcript += f;
              state.onboarding.interim = im;
              render();
            };
            rec.onerror = () => { state.onboarding.isListening = false; render(); };
            rec.onend = () => { state.onboarding.isListening = false; render(); };
            state.onboarding.recognition = rec;
            try { rec.start(); } catch (e) {}
          }

          state.onboarding.timerId = setInterval(() => {
            state.onboarding.timeLeft -= 1;
            if (state.onboarding.timeLeft <= 0) {
              clearInterval(state.onboarding.timerId);
              finishPlacementTest();
            } else {
              render();
            }
          }, 1000);
        });

        document.getElementById('ob-finish-btn')?.addEventListener('click', () => {
          finishPlacementTest();
        });

        document.getElementById('ob-complete-btn')?.addEventListener('click', () => {
          const detected = state.onboarding.result?.level || 'Intermediate';
          state.showOnboarding = false;
          saveUserData({
            ...state.userData,
            level: detected,
            onboardingCompleted: true
          });
          render();
        });
      }

      async function finishPlacementTest() {
        if (state.onboarding.timerId) clearInterval(state.onboarding.timerId);
        if (state.onboarding.recognition) {
          try { state.onboarding.recognition.stop(); } catch (e) {}
        }
        const fallback = document.getElementById('ob-fallback-text')?.value || '';
        const text = (state.onboarding.transcript + ' ' + state.onboarding.interim + ' ' + fallback).trim();
        state.onboarding.step = 'analyzing';
        render();

        if (!text || text.split(/\s+/).length < 4) {
          state.onboarding.result = {
            level: 'Beginner',
            summary: 'Great start! We placed you at Beginner so you can build smooth everyday speaking confidence step by step.',
            strengths: 'Willingness to jump in and speak',
            focusArea: 'Building complete everyday sentences'
          };
          state.onboarding.step = 'result';
          render();
          return;
        }

        try {
          const res = await callGeminiStructured({
            systemInstruction: 'You are an expert CEFR English speaking placement assessor. Analyze the spoken transcript from a 60-second placement test and assign Beginner, Intermediate, or Advanced.',
            userPrompt: `Analyze this 60-second spoken English placement sample:\n"${text}"`,
            responseSchema: {
              type: 'OBJECT',
              properties: {
                level: { type: 'STRING', enum: ['Beginner', 'Intermediate', 'Advanced'] },
                summary: { type: 'STRING' },
                strengths: { type: 'STRING' },
                focusArea: { type: 'STRING' }
              },
              required: ['level', 'summary', 'strengths', 'focusArea']
            }
          });
          state.onboarding.result = res;
        } catch (e) {
          const wc = text.split(/\s+/).length;
          const lvl = wc > 65 ? 'Advanced' : wc > 25 ? 'Intermediate' : 'Beginner';
          state.onboarding.result = {
            level: lvl,
            summary: `Based on your ${wc}-word speaking sample, you're a great fit for our ${lvl} track!`,
            strengths: 'Clear communication of personal ideas',
            focusArea: 'Expanding vocabulary and natural phrasing'
          };
        }
        state.onboarding.step = 'result';
        render();
      }

      function attachCallEvents() {
        document.getElementById('mute-ai-btn')?.addEventListener('click', () => {
          if (!state.call) return;
          state.call.isMutedAI = !state.call.isMutedAI;
          if (state.call.isMutedAI && 'speechSynthesis' in window) window.speechSynthesis.cancel();
          renderCallView();
        });

        document.querySelectorAll('[data-replay]').forEach((btn) => {
          btn.addEventListener('click', () => {
            speakCoachReply(btn.getAttribute('data-replay'));
          });
        });

        document.getElementById('refresh-sug-btn')?.addEventListener('click', () => {
          if (!state.call) return;
          const lastAi = [...state.call.messages].reverse().find((m) => m.role === 'ai');
          if (lastAi) fetchSuggestionsForCoachMessage(lastAi.text);
        });

        document.getElementById('toggle-sug-btn')?.addEventListener('click', () => {
          if (!state.call) return;
          state.call.showSuggestions = !state.call.showSuggestions;
          renderCallView();
        });

        document.querySelectorAll('[data-sug-idx]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (!state.call) return;
            const idx = Number(btn.getAttribute('data-sug-idx'));
            const sug = state.call.suggestions[idx];
            if (sug) handleUserTurnComplete(sug.text);
          });
        });

        document.getElementById('toggle-type-btn')?.addEventListener('click', () => {
          if (!state.call) return;
          state.call.showTextFallback = !state.call.showTextFallback;
          renderCallView();
        });

        document.getElementById('call-text-form')?.addEventListener('submit', (e) => {
          e.preventDefault();
          const inp = document.getElementById('call-text-input');
          if (!inp || !inp.value.trim()) return;
          const txt = inp.value.trim();
          inp.value = '';
          handleUserTurnComplete(txt);
        });

        document.getElementById('big-mic-btn')?.addEventListener('click', () => {
          if (!state.call) return;
          if (state.call.turnState === 'listening') {
            stopCallRecognition();
            state.call.turnState = 'paused';
            renderCallView();
          } else {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            startCallListening();
          }
        });

        document.getElementById('done-speaking-btn')?.addEventListener('click', () => {
          if (!state.call) return;
          const spoken = (state.call.pendingSpeech + ' ' + state.call.interimTranscript).trim();
          if (spoken) {
            stopCallRecognition();
            handleUserTurnComplete(spoken);
          }
        });

        document.getElementById('end-call-btn')?.addEventListener('click', () => {
          finishVoiceCall();
        });
      }

      function attachReportEvents() {
        const closeRep = () => {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          state.report = null;
          state.activeTab = 'home';
          render();
        };

        document.getElementById('report-done-btn')?.addEventListener('click', closeRep);
        document.getElementById('report-home-btn')?.addEventListener('click', closeRep);

        document.getElementById('report-again-btn')?.addEventListener('click', () => {
          const rep = state.report;
          if (!rep) return;
          startVoiceCall({ title: rep.topic, day: rep.day, level: rep.level });
        });

        document.querySelectorAll('[data-speak-line]').forEach((btn) => {
          btn.addEventListener('click', () => {
            speakText(btn.getAttribute('data-speak-line'), 0.95, state.userData.settings.voiceURI);
          });
        });

        const drills =
          state.report?.mistakes && state.report.mistakes.length
            ? state.report.mistakes.map((m) => m.corrected)
            : ['I really enjoyed practicing my English conversation today.'];
        const currDrill = drills[state.drill.index % drills.length];

        document.getElementById('drill-hear-btn')?.addEventListener('click', () => {
          speakText(currDrill, 0.92, state.userData.settings.voiceURI);
        });

        document.getElementById('drill-next-btn')?.addEventListener('click', () => {
          state.drill.index = (state.drill.index + 1) % drills.length;
          state.drill.spoken = '';
          state.drill.accuracy = null;
          render();
        });

        document.getElementById('drill-mic-btn')?.addEventListener('click', () => {
          const SR = getSpeechRecognitionClass();
          if (!SR) {
            state.drill.spoken = currDrill;
            state.drill.accuracy = 100;
            render();
            return;
          }
          state.drill.spoken = '';
          state.drill.accuracy = null;
          const rec = new SR();
          rec.lang = 'en-US';
          rec.interimResults = false;
          rec.onstart = () => { state.drill.isRecording = true; render(); };
          rec.onresult = (ev) => {
            const spoken = ev.results[0][0].transcript;
            state.drill.spoken = spoken;
            state.drill.accuracy = calculateSentenceSimilarity(currDrill, spoken);
            render();
          };
          rec.onerror = () => { state.drill.isRecording = false; render(); };
          rec.onend = () => { state.drill.isRecording = false; render(); };
          state.drill.recognition = rec;
          try { rec.start(); } catch (e) {}
        });
      }

      // ========================================================================
      // BOOTSTRAP
      // ========================================================================
      applyTheme();
      if (!state.userData.onboardingCompleted) {
        state.showOnboarding = true;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          if (!state.call && !state.report) render();
        };
      }
      render();
      initFirebaseOptional();
    </script>
  </body>
</html>
